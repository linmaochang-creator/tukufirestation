<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}

.hp{width:84px;height:8px}
#snd,#pauseBtn{font:inherit;font-size:.78rem;color:var(--ink);background:var(--btn);border:1.5px solid var(--btn-line);border-radius:8px;padding:5px 10px;min-height:32px;pointer-events:auto}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const K=8;                            /* 截圖 1px = 遊戲 8px */
const WW=Math.round(1207*K),WH=Math.round(860*K);
const P=(x,y)=>[x*K,y*K];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* ---------- 道路（座標＝Google 地圖截圖像素，示意描繪） ---------- */
const RD={};
function segNear(px,py,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;
  let t=l2?((px-a[0])*dx+(py-a[1])*dy)/l2:0;t=clamp(t,0,1);
  return[a[0]+dx*t,a[1]+dy*t,t];
}
function nearOnPoly(pts,x,y){
  let best=null,bd=1e18;
  for(let i=0;i<pts.length-1;i++){
    const q=segNear(x,y,pts[i],pts[i+1]),d=(q[0]-x)**2+(q[1]-y)**2;
    if(d<bd){bd=d;best={x:q[0],y:q[1],i,t:q[2],d:Math.sqrt(d)};}
  }
  return best;
}
const S=(n,x,y)=>{const q=nearOnPoly(RD[n].pts,x*K,y*K);return[q.x,q.y];};
function road(name,w,pts,kind){w=Math.round(w*1.12);RD[name]={name,w,kind,pts,len:0,cum:[0]};
  for(let i=1;i<pts.length;i++){RD[name].cum.push(RD[name].cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));}
  RD[name].len=RD[name].cum[pts.length-1];}
road('145',80,[P(742,118),P(747,175),P(760,230),P(770,310),P(773,380),P(775,460),P(772,500),P(762,545),P(750,590),P(725,655),P(670,680),P(605,700),P(530,735),P(445,760),P(380,787),P(300,800),P(200,806),P(120,800),P(60,815),P(0,845)],'main');
road('158',80,[P(480,35),P(505,62),P(530,95),P(580,138),P(615,150),P(660,136),P(705,122),P(742,118),P(860,95),P(950,85),P(1060,67),P(1180,45)],'main');
road('圓環線',72,[P(262,655),P(245,705),P(222,745),S('145',203,803)],'main');
road('中正路',64,[S('158',590,143),P(540,185),P(478,232),P(446,278),P(428,318),P(385,372),P(330,430),P(285,480),P(245,525),P(218,570),P(212,610),P(256,636)],'st');
road('中山路',64,[S('158',628,152),P(600,178),P(560,220),P(525,268),P(490,320),P(452,372),P(410,430),P(362,497),P(318,552),P(290,590),P(268,628)],'st');
road('文化路',64,[S('158',520,105),P(505,125),P(470,170),P(430,215),P(395,255),P(350,295),P(313,335),P(280,380),P(245,430),P(215,480),P(195,530),P(190,575),P(205,612),P(256,636)],'st');
road('修德街',56,[S('文化路',380,268),S('中正路',450,272),S('中山路',520,262)],'st');
road('大同路',64,[S('文化路',318,338),S('中正路',428,340),S('中山路',475,346),P(560,352),P(650,352),P(745,352),S('145',773,350)],'st');
road('仁美街',64,[S('中山路',330,543),P(380,543),P(450,545),P(540,540),P(620,532),P(690,524),P(725,538),S('145',760,548)],'st');
road('成功路E',64,[S('145',756,572),P(800,585),P(850,600),P(910,625),P(960,640),P(1060,665),P(1180,695)],'st');
road('圓路35巷',56,[S('158',900,90),P(902,160),P(900,230),P(895,300),P(890,360),P(878,415),P(865,432)],'st');
road('越港路',56,[S('成功路E',826,592),P(835,545),P(843,500),P(852,455),S('圓路35巷',866,430)],'st');
road('醫院路',60,[S('145',773,345),P(800,332),P(850,314),S('圓路35巷',898,302)],'st');
road('校路',56,[S('圓路35巷',900,282),P(960,262),P(1010,243),P(1075,212)],'st');
road('永年路',56,[S('158',955,88),P(985,125),P(1020,175),S('校路',1075,212)],'st');
road('可可路',56,[S('圓路35巷',866,432),P(910,432),P(950,428),P(985,425)],'st');
road('中央路',60,[S('145',203,803),P(165,765),P(135,730),P(110,700),P(125,672),P(165,655),P(215,650),P(258,643)],'st');
function atRoad(name,x,y){const q=nearOnPoly(RD[name].pts,x*K,y*K);const p=RD[name].pts;
  const a=Math.atan2(p[q.i+1][1]-p[q.i][1],p[q.i+1][0]-p[q.i][0]);
  return{x:q.x,y:q.y,a,i:q.i,t:q.t,road:name,s:RD[name].cum[q.i]+q.t*(RD[name].cum[q.i+1]-RD[name].cum[q.i])};}
/* 沿路徑取點 */
function pointAt(r,s){
  const R=RD[r],p=R.pts;s=clamp(s,0,R.len);
  let i=1;while(i<p.length-1&&R.cum[i]<s)i++;
  const a=p[i-1],b=p[i],l=R.cum[i]-R.cum[i-1]||1,t=(s-R.cum[i-1])/l;
  return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,a:Math.atan2(b[1]-a[1],b[0]-a[0])};
}
/* ---------- 道路符號距離場（碰撞用，正值＝路面內） ---------- */
const CELL=8,GW=Math.ceil(WW/CELL),GH=Math.ceil(WH/CELL);
const SDF=new Float32Array(GW*GH);
function dt1(f,n,out,v,z){
  let k=0;v[0]=0;z[0]=-1e20;z[1]=1e20;
  for(let q=1;q<n;q++){
    let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);
    while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);}
    k++;v[k]=q;z[k]=s;z[k+1]=1e20;
  }
  k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const dx=q-v[k];out[q]=dx*dx+f[v[k]];}
}
function edt(feat,w,h){
  const f=new Float64Array(w*h);for(let i=0;i<w*h;i++)f[i]=feat[i]?0:1e20;
  const m=Math.max(w,h),col=new Float64Array(m),out=new Float64Array(m),v=new Int32Array(m),z=new Float64Array(m+1);
  for(let x=0;x<w;x++){for(let y=0;y<h;y++)col[y]=f[y*w+x];dt1(col,h,out,v,z);for(let y=0;y<h;y++)f[y*w+x]=out[y];}
  for(let y=0;y<h;y++){for(let x=0;x<w;x++)col[x]=f[y*w+x];dt1(col,w,out,v,z);for(let x=0;x<w;x++)f[y*w+x]=out[x];}
  return f;
}
(function buildSDF(){
  const cv=document.createElement('canvas');cv.width=GW;cv.height=GH;const g=cv.getContext('2d');

const CARCOL=['#e3e6ea','#2f3b4b','#b23a3a','#e2c35a','#4b7a9e','#6e8a5c','#7b5b8c','#c98a4a','#555e68'];
function spawnCar(first){
  const names=Object.keys(RD);
  for(let tries=0;tries<60;tries++){
    const n=names[Math.floor(Math.random()*names.length)],R=RD[n];
    if(Math.random()*500>R.len/6&&tries<40)continue;
    const s=40+Math.random()*(R.len-80),p=pointAt(n,s);
    const ref=V||{x:STATION[0],y:STATION[1]};
    const d=Math.hypot(p.x-ref.x,p.y-ref.y);
    if(first?d<500:(d<750||d>1500))continue;
    if(blk.some(b=>Math.hypot(b.x-p.x,b.y-p.y)<120))continue;
    if(cars.some(c=>Math.hypot(c.x-p.x,c.y-p.y)<90))continue;
    if(LIGHTS.some(L=>Math.hypot(L.x-p.x,L.y-p.y)<70))continue;
    if(F&&Math.hypot(F.x-p.x,F.y-p.y)<330)continue;
    const c={road:n,s,dir:Math.random()<.5?1:-1,v:0,vmax:42+Math.random()*28,lat:0,x:p.x,y:p.y,a:p.a,col:CARCOL[Math.floor(Math.random()*CARCOL.length)],stub:Math.random()<.38,hk:0,stall:0,yl:false,bub:0,lanepref:0};
    c.lat=(R.kind==='main'?R.w/4:12);
    if(first){cars.push(c);}else{if(cars.length<MIS[G.mi].traffic)cars.push(c);else return c;}
    return c;
  }
  return null;
}
function carLane(c){return RD[c.road].kind==='main'?RD[c.road].w/4:12;}
function updateCars(dt){
  const act=PPmode()?PP:V;
  const person=PPmode();
  for(let i=0;i<cars.length;i++){
    const c=cars[i],R=RD[c.road];
    c.bub=Math.max(0,c.bub-dt);c.stall=Math.max(0,c.stall-dt);
    let vt=c.vmax;
    /* 紅燈 */
    const rl=ROADLIGHTS[c.road];
    if(rl)for(const e of rl){
      const ahead=(e.s-c.s)*c.dir;
      if(ahead>12&&ahead<120&&!lightGreen(e.L,e.g,G.t)){vt=Math.min(vt,Math.sqrt(2*95*Math.max(0,ahead-14)));}
    }
    /* 前方障礙（車、玩家、人、停放的消防車） */
    const ca=Math.cos(c.a),sa=Math.sin(c.a);
    const chk=(ox,oy,lw)=>{
      const dx=ox-c.x,dy=oy-c.y;if(dx>140||dx<-140||dy>140||dy<-140)return;
      const fwd=dx*ca+dy*sa,lat=-dx*sa+dy*ca;
      const gap=34+c.v*.7;
      if(fwd>0&&fwd<gap&&Math.abs(lat)<lw){vt=Math.min(vt,fwd<26?0:(fwd-26)*1.7);}
    };
    for(let j=0;j<cars.length;j++)if(j!==i)chk(cars[j].x,cars[j].y,15);
    if(V)chk(V.x,V.y,17);
    if(PP)chk(PP.x,PP.y,14);
    for(const pk of park)chk(pk.x,pk.y,17);
    for(const u of npcs)chk(u.x,u.y,17);
    for(const b of blk)chk(b.x,b.y,18);
    /* 禮讓 */
    let haz=false;
    if(act){const d=Math.hypot(act.x-c.x,act.y-c.y),R_=person?150:310;haz=d<(c.yl?R_+70:R_);}
    c.yl=haz;
    const nearNode=LIGHTS.some(L=>Math.hypot(L.x-c.x,L.y-c.y)<54);
    const willYield=haz&&(person||!c.stub||c.hk>0);
    let latT=carLane(c);
    if(haz&&!person&&c.stub&&!c.hk&&c.bub<=0.01)c.bub=.3;
    if(willYield){
      if(!c.wasY){c.wasY=1;if(!person){G.s.yielded++;if(!laneShown)laneWant=1;}}
      if(!nearNode)vt=0;
      latT=ILL.some(l=>Math.hypot(l.x-c.x,l.y-c.y)<44)?12:R.w/2-11;
    }else c.wasY=0;
    if(c.stall>0)vt=0;
    const dec=vt<c.v?150:60;
    c.v+=clamp(vt-c.v,-dec*dt,60*dt);
    c.lat+=clamp(latT-c.lat,-34*dt,34*dt);
    const ps=c.s;
    c.s+=c.v*dt*c.dir;
    /* 路口轉彎 */
    const xs=ROADX[c.road];
    for(const x of xs){
      if((ps<x.s&&c.s>=x.s)||(ps>x.s&&c.s<=x.s)){
        if(Math.random()<.42){
          const cand=[...x.nd.roads].filter(r=>r!==c.road);
          if(cand.length){
            const r2=cand[Math.floor(Math.random()*cand.length)],s2=sOn(r2,x.nd.x,x.nd.y),L2=RD[r2].len;
            c.road=r2;c.s=s2;c.dir=s2<40?1:s2>L2-40?-1:(Math.random()<.5?1:-1);
            c.lat=carLane(c);
            break;
          }
        }
      }
    }
    const Rn=RD[c.road];
    if(c.s<=2&&c.dir<0||c.s>=Rn.len-2&&c.dir>0){c.dir*=-1;c.lat=-c.lat;c.s=clamp(c.s,3,Rn.len-3);}
    const p=pointAt(c.road,c.s),ha=p.a+(c.dir<0?Math.PI:0);
    const rx=-Math.sin(ha),ry=Math.cos(ha);
    c.x=p.x+rx*c.lat;c.y=p.y+ry*c.lat;
    c.a+=angd(ha,c.a)*Math.min(1,dt*8);
    if(F&&Math.hypot(c.x-F.x,c.y-F.y)<280){
      const sxp=(c.x-cam.x)*cam.z+vw/2,syp=(c.y-cam.y)*cam.z+vh/2;
      if(sxp<-60||sxp>vw+60||syp<-60||syp>vh+60){cars.splice(i,1);i--;spawnCar(false);continue;}
    }
    /* 太遠就重生到玩家附近 */
    if(act&&Math.hypot(c.x-act.x,c.y-act.y)>1700){cars.splice(i,1);i--;spawnCar(false);}
  }
}

  for(const pk of park){const T=VT[pk.type];for(const o of T.circ)circs.push({x:pk.x+Math.cos(pk.a)*o,y:pk.y+Math.sin(pk.a)*o,r:T.r,park:1});}
  for(const u of npcs){const T=VT[u.type];for(const o of T.circ)circs.push({x:u.x+Math.cos(u.a)*o,y:u.y+Math.sin(u.a)*o,r:T.r,park:1});}
  for(const c of cars){for(const o of[-8,8])circs.push({x:c.x+Math.cos(c.a)*o,y:c.y+Math.sin(c.a)*o,r:8.6,car:c,v:c.v});}
}
function collideVeh(v){
  const T=VT[v.type];let impact=0,hit=null;
  for(let it=0;it<2;it++)for(const o of T.circ){
    const cx=v.x+Math.cos(v.a)*o,cy=v.y+Math.sin(v.a)*o,d=sd(cx,cy);
    if(d<T.r){
      let g=sdGrad(cx,cy);const gl=Math.hypot(g[0],g[1])||1;g=[g[0]/gl,g[1]/gl];
      const pen=Math.min(T.r-d,10);v.x+=g[0]*pen;v.y+=g[1]*pen;
      const vn=-(Math.cos(v.a)*g[0]+Math.sin(v.a)*g[1])*v.v;
      if(vn>0){impact=Math.max(impact,vn);v.v*=.8;}
    }
    for(const c of circs){
      const dx=cx-c.x,dy=cy-c.y;if(dx>60||dx<-60||dy>60||dy<-60)continue;
      const dd=Math.hypot(dx,dy),mr=T.r+c.r;
      if(dd<mr&&dd>.01){
        const pen=mr-dd;v.x+=dx/dd*pen;v.y+=dy/dd*pen;
        impact=Math.max(impact,Math.abs(v.v)*.9+(c.v||0)*.5);hit=c;v.v*=.7;
        if(c.car)c.car.stall=1.1;
      }
    }
  }
  return{impact,hit};
}
/* ---------- 開車 ---------- */
function driveVeh(v,dt){
  const T=VT[v.type];
  const tg=(inp.r?1:0)-(inp.l?1:0);
  const rn=MIS[G.mi].rain?1:0;
  v.steer+=(tg-v.steer)*Math.min(1,dt*(tg?(rn?4:7):(rn?6:11)));
  if(inp.gas&&!inp.brk){v.v+=(v.v<0?T.brk:T.acc*(rn?.85:1)*(1-Math.max(0,v.v)/T.vmax))*dt;}
  else if(inp.brk){v.v-=(v.v>3?T.brk*(rn?.55:1):T.rev)*dt;if(v.v<-T.rev*.6)v.v=-T.rev*.6;}
  else{const dr=Math.min(Math.abs(v.v),(28+Math.abs(v.v)*.9)*(rn?.6:1)*dt);v.v-=Math.sign(v.v)*dr;}
  const d=v.steer*T.maxst*(1-.5*Math.min(1,Math.abs(v.v)/T.vmax));
  v.a+=v.v/T.wb*Math.tan(d)*dt;
  v.x+=Math.cos(v.a)*v.v*dt;v.y+=Math.sin(v.a)*v.v*dt;
  G.s.driven+=Math.abs(v.v)*dt*M_PER_PX;
}

function snapPark(v,tx,ty){
  let best=null,bd=1e18;
  for(const n in RD){const q=nearOnPoly(RD[n].pts,v.x,v.y);if(q.d<bd){bd=q.d;best={n,q};}}
  const R=RD[best.n],p=R.pts,a=Math.atan2(p[best.q.i+1][1]-p[best.q.i][1],p[best.q.i+1][0]-p[best.q.i][0]);
  const nn=sideNormal(a),sg=((tx-best.q.x)*nn.x+(ty-best.q.y)*nn.y)>0?1:-1,off=R.w/2-16;
  const ha=Math.abs(angd(a,v.a))<Math.PI/2?a:a+Math.PI;
  return{x:best.q.x+nn.x*sg*off,y:best.q.y+nn.y*sg*off,a:ha};
}

function npcUpdate(dt){
  for(const u of npcs){
    if(u.state==='wait'){u.delay-=dt;if(u.delay<=0)u.state='drive';continue;}
    if(u.state==='drive'){
      const tgt=u.path[u.idx];
      if(!tgt){npcPark(u);continue;}
      const dx=tgt[0]-u.x,dy=tgt[1]-u.y,d=Math.hypot(dx,dy);
      u.a+=angd(Math.atan2(dy,dx),u.a)*Math.min(1,dt*6);
      let vm=125;if(u.idx>=u.path.length-1)vm=Math.min(vm,28+d*.55);
      u.v=Math.min(vm,u.v+90*dt);
      const step=u.v*dt;
      if(d<=step+3){u.x=tgt[0];u.y=tgt[1];u.idx++;}
      else{u.x+=dx/d*step;u.y+=dy/d*step;}
    }else if(u.state==='park'){
      u.rt-=dt;
      const sts=[F].concat(neigh).filter(q=>!q.out);
      if(u.rt<=0){u.rt=.8;
        let best=null,bs=-1e9;
        for(const q of sts){const d=Math.hypot(q.cx-u.x,q.cy-u.y);const sc=(q.burning?60:q.heat)-d*.15;if(sc>bs){bs=sc;best=q;}}
        u.tg=best;
        if(best){const dx=best.cx-u.x,dy=best.cy-u.y,d=Math.hypot(dx,dy)||1,k=Math.min(75,Math.max(20,d-40))/d;u.nz={x:u.x+dx*k,y:u.y+dy*k};}
      }
      if(u.tg&&u.nz){
        for(const q of sts){if(Math.hypot(q.cx-u.nz.x,q.cy-u.nz.y)<(Math.max(q.b.w,q.b.h)*.5+85))hitState(q,u.tg===q?24*dt:12*dt,30*dt);}
        if(Math.random()<.9)fx.push({type:'w',x:u.nz.x,y:u.nz.y,vx:(u.tg.cx-u.nz.x)*1.2+(Math.random()-.5)*14,vy:(u.tg.cy-u.nz.y)*1.2+(Math.random()-.5)*14,life:.55});
      }
    }
  }
}

function update(dt){

      if(Math.hypot(V.x-L.x,V.y-L.y)<26&&Math.abs(V.v)>95&&!V.redT){
        const red=L.list.some(l=>{const dv=Math.abs(angd(V.a,l.a));const along=(dv<Math.PI/4||dv>3*Math.PI/4);return along&&!lightGreen(L,l.g,G.t);});
        if(red){V.redT=2;s.redPass++;toast('過紅燈要減速確認，左右車可能不讓','warn',1800);}
      }
    }

    /* 發現堵路 */
    if(V&&G.blkInfo&&!G.blkInfo.found&&Math.hypot(V.x-G.blkInfo.x,V.y-G.blkInfo.y)<300){
      G.blkInfo.found=true;discovered=[{road:G.blkInfo.road,s:G.blkInfo.s}];gpsT=0;

    }

    else finishMission(true);
  }

  if(PP){
    for(const c of cars){

function mkRubble(b){
  const r=rng(99),tr=b.tr||{x:0,y:1},cx=b.x+b.w/2+tr.x*26,cy=b.y+b.h/2+tr.y*26,COL=['#8c867c','#a8a196','#6f6a62','#b9b2a5','#5b5650','#c4b9a6'];
  b.rub=[];b.bar=[];
  for(let i=0;i<110;i++){
    const a=r()*6.283,d=Math.sqrt(r())*54,big=i<8;
    b.rub.push({x:cx+Math.cos(a)*d*1.15,y:cy+Math.sin(a)*d*.95,w:big?22+r()*12:4+r()*13,h:big?14+r()*8:3+r()*9,a:r()*3.14,s:r(),col:COL[(r()*COL.length)|0]});
  }
  for(let i=0;i<14;i++){const a=r()*6.283,d=Math.sqrt(r())*48;b.bar.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,l:10+r()*16,a:r()*3.14,s:r()});}
  b.rc={x:cx,y:cy};
}
function drawBldg(b){

      ctx.moveTo(rx+b.w*.2,ry);ctx.lineTo(rx+b.w*.3,ry+b.h*.25);ctx.lineTo(rx+b.w*.22,ry+b.h*.45);ctx.lineTo(rx+b.w*.4,ry+b.h*.7);ctx.lineTo(rx+b.w*.35,ry+b.h);

    }

  const rc=b.rc;
  ctx.fillStyle='rgba(0,0,0,'+(.26*Math.min(1,c*2))+')';ctx.beginPath();ctx.ellipse(rc.x,rc.y,66,56,0,0,6.3);ctx.fill();

    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  }

function roomy(x,y,m){if(sd(x,y)<-8)return false;for(const c of circs)if(Math.hypot(x-c.x,y-c.y)<c.r+m)return false;return true;}
function stepOK(nx,ny){
  if(sd(nx,ny)<-14&&sd(nx,ny)<sd(PP.x,PP.y))return false;
  for(const c of circs){const dn=Math.hypot(nx-c.x,ny-c.y);if(dn<c.r+4.5&&dn<Math.hypot(PP.x-c.x,PP.y-c.y))return false;}
  return true;
}
function trapped(){for(let k=0;k<8;k++){const a=k*.785;if(stepOK(PP.x+Math.cos(a)*2,PP.y+Math.sin(a)*2))return false;}return true;}

function addBlock(){
  const g=goalNow();if(!g||!V||!gps)return false;
  let tx=null,acc=0;
  for(let i=1;i<gps.length;i++){acc+=Math.hypot(gps[i][0]-gps[i-1][0],gps[i][1]-gps[i-1][1]);if(acc>480){tx=gps[i];break;}}
  if(!tx||Math.hypot(tx[0]-g.x,tx[1]-g.y)<280)return false;
  let bn=null,bd=1e9,bq=null;
  for(const n in RD){const q=nearOnPoly(RD[n].pts,tx[0],tx[1]);if(q.d<bd){bd=q.d;bn=n;bq=q;}}
  if(!bn||bd>30)return false;
  const R=RD[bn],sv=R.cum[bq.i]+bq.t*(R.cum[bq.i+1]-R.cum[bq.i]);
  const nd=discovered.concat([{road:bn,s:sv}]);
  const r=route(V.x,V.y,g.x,g.y,nd);
  if(!r||r.length<3)return false;
  const p=R.pts,a=Math.atan2(p[bq.i+1][1]-p[bq.i][1],p[bq.i+1][0]-p[bq.i][0]),nn=sideNormal(a);
  for(let o=-R.w/2+8;o<=R.w/2-7;o+=16){const c={x:bq.x+nn.x*o,y:bq.y+nn.y*o};statC.push({x:c.x,y:c.y,r:9,cone:1});G.cones.push(c);}
  discovered=nd;gpsT=0;
  return true;
}

function spawnRes(){
  RES=[];SAFE=null;const M=MIS[G.mi];if(!M.res)return;
  const R=RD[M.road],bs=atRoad(M.road,M.at[0],M.at[1]);
  const ox=-Math.cos(wind.a),oy=-Math.sin(wind.a);
  let best=null,bd=-1e9;
  for(const ds of[-320,-250,250,320]){const sv=clamp(bs.s+ds,12,R.len-12),p=pointAt(M.road,sv),sc=(p.x-F.x)*ox+(p.y-F.y)*oy;if(sc>bd){bd=sc;best={x:p.x,y:p.y};}}
  SAFE=best;
  for(let i=0;i<M.res;i++){
    const side=i%2?1:-1,sv=clamp(bs.s+side*(30+Math.floor(i/2)*36+i*5),8,R.len-8),p=pointAt(M.road,sv),nn=sideNormal(p.a);
    const lat=(R.w/2-12)*(i%3===0?1:-1);
    RES.push({x:p.x+nn.x*lat,y:p.y+nn.y*lat,state:'wait',hp:100,ang:0,walk:0});
  }
}
function resUpdate(dt){

  const h=PP.hist||(PP.hist=[]),l=h[h.length-1];
  if(!l||Math.hypot(PP.x-l[0],PP.y-l[1])>7){h.push([PP.x,PP.y]);if(h.length>240)h.shift();}
  let k=0;const burn=[F].concat(neigh).filter(q=>q.burning);
  for(const r of RES){
    if(r.state==='hurt')continue;
    if(r.state==='wait'&&Math.hypot(PP.x-r.x,PP.y-r.y)<40){r.state='follow';toast('居民跟著你，帶他們到綠色集合點（上風處）','',2000);}
    if(r.state==='follow'){
      k++;let tg=h[Math.max(0,h.length-1-6*k)]||[PP.x,PP.y];
      if(SAFE&&Math.hypot(PP.x-SAFE.x,PP.y-SAFE.y)<90)tg=[SAFE.x+Math.cos(k*2.1)*18,SAFE.y+Math.sin(k*2.1)*18];
      const dx=tg[0]-r.x,dy=tg[1]-r.y,d=Math.hypot(dx,dy);
      if(d>4){const st=Math.min(d,88*dt);r.x+=dx/d*st;r.y+=dy/d*st;r.ang=Math.atan2(dy,dx);r.walk+=dt*10;}
      if(SAFE&&Math.hypot(r.x-SAFE.x,r.y-SAFE.y)<46){r.state='safe';beep(880,.2,'triangle',.1);toast('居民安全抵達集合點','',1600);}
    }
    if(r.state!=='safe'){
      for(const q of burn)if(Math.hypot(r.x-q.cx,r.y-q.cy)<100){r.hp-=9*dt;break;}
      if(r.hp<=0){r.state='hurt';G.s.resHurt++;toast('居民被火勢波及受傷！','bad',2400);buzz(60);}
    }
  }
}

function hazUpdate(dt){
  if(G.stun>0)G.stun-=dt;
  if(G.ph==='rescue'&&PP&&MIS[G.mi].quake){quakeHaz(dt);return;}
  if(G.ph!=='fight'||!PP||F.out){haz=null;return;}
  if(haz){
    haz.t-=dt;

      const d=Math.hypot(PP.x-haz.x,PP.y-haz.y);
      if(d<haz.r){
        G.s.ffHit++;G.stun=1.6;shake=1;buzz(120);beep(150,.4,'sawtooth',.14);
        toast(haz.k==='flash'?'消防員被閃燃火焰波及！':'消防員吸入有毒氣體！','bad',2600);
        const kx=(PP.x-haz.x)/(d||1),ky=(PP.y-haz.y)/(d||1);
        for(let q=60;q>=10;q-=10){const nx=PP.x+kx*q,ny=PP.y+ky*q;if(sd(nx,ny)>=-14){PP.x=nx;PP.y=ny;break;}}
      }else{G.s.ffDodge++;toast('成功避開！','',1600);beep(880,.15,'triangle',.08);}
      if(haz.k==='flash')for(let i=0;i<18;i++)fx.push({type:'p',x:haz.x+(Math.random()-.5)*haz.r,y:haz.y+(Math.random()-.5)*haz.r,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.6});
      haz=null;G.hazT=16+Math.random()*10;
    }
    return;
  }
  G.hazT-=dt;
  if(G.hazN<3&&G.hazT<=0){
    const k=Math.random()<.5?'flash':'gas';
    let c;
    if(k==='flash'){const bs=[F].concat(neigh).filter(q=>q.burning);c=bs.length?bs[(Math.random()*bs.length)|0]:F;}
    else c=neigh.length?neigh[(Math.random()*neigh.length)|0]:F;
    const r=k==='flash'?120:100;
    if(Math.hypot(PP.x-c.cx,PP.y-c.cy)>r+90){G.hazT=3;return;}

    beep(300,.18,'square',.1);setTimeout(()=>beep(300,.18,'square',.1),240);
  }
}

  if(M.co){req.length=0;req.push('空氣呼吸器','四用氣體偵測器（含一氧化碳）','擔架','AED 自動體外電擊器','氧氣急救設備','防護衣帽');}
  if(M.quake){req.length=0;req.push('防護衣帽','頭盔與手套','擔架','AED 自動體外電擊器','生命探測器','油壓擴張器（破壞器材）');}
  const bad=['野餐墊','釣魚竿','音響喇叭','遙控賽車'].sort(()=>Math.random()-.5).slice(0,3);
  const items=req.map(n=>({n,ok:1})).concat(bad.map(n=>({n,ok:0}))).sort(()=>Math.random()-.5);
  G.kit={items,sel:new Set()};G.mode='kit';
  sheet('<span class="sub">出勤前裝備檢查</span><h2>這一件要帶哪些裝備？</h2>'+
    '<p>點選本案<b>需要攜帶</b>的裝備（可複選），選好按「確認出發」。全對有加分。</p>'+
    '<div class="pick">'+items.map((it,i)=>'<button type="button" data-a="kit'+i+'">'+esc(it.n)+'</button>').join('')+'</div>'+
    '<p id="kitmsg" class="lesson" hidden></p>'+
    '<div class="btns"><button type="button" data-a="kitskip">略過（無加分）</button><button type="button" class="go" data-a="kitok">確認出發</button></div>');
}
function kitCheck(){
  const k=G.kit,miss=[],extra=[];
  k.items.forEach((it,i)=>{const on=k.sel.has(i);if(it.ok&&!on)miss.push(it.n);if(!it.ok&&on)extra.push(it.n);});
  if(!miss.length&&!extra.length){G.kitBonus=G.kitWrong?25:60;toast(G.kitWrong?'裝備齊全！':'裝備全對！加分','',1800);startRun();return;}
  G.kitWrong=1;const m=$('#kitmsg');m.hidden=false;
  m.innerHTML=(miss.length?'<b>漏帶：</b>'+miss.map(esc).join('、')+'。':'')+(extra.length?'<b>不需要：</b>'+extra.map(esc).join('、')+'。':'')+' 再檢查一次。';
}
function startRun(){
  ovEl.hidden=true;G.mode='play';
  if(MIS[G.mi].rain)toast('下雨路滑：煞車距離變長、轉向變慢','warn',3200);
}
function pause(){
  if(G.mode!=='play')return;
  G.mode='paused';inp.l=inp.r=inp.gas=inp.brk=inp.spray=0;document.querySelectorAll('.pad').forEach(b=>b.classList.remove('on'));
  sheet('<h2>暫停中</h2><div class="btns"><button type="button" data-a="menu">回主畫面</button><button type="button" class="go" data-a="resume">繼續</button></div>');
}
function hold(id,key){
  const b=$(id);
  const on=e=>{e.preventDefault();inp[key]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{inp[key]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
hold('#bL','l');hold('#bR','r');hold('#bGas','gas');hold('#bBrk','brk');
{const hb=$('#honk');
hb.addEventListener('pointerdown',e=>{e.preventDefault();if(G.ph==='fight'){inp.spray=1;hb.classList.add('on');try{hb.setPointerCapture(e.pointerId);}catch(_){}}else honk();});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hb.addEventListener(ev,()=>{inp.spray=0;hb.classList.remove('on');}));}
$('#pauseBtn').addEventListener('click',pause);
$('#snd').addEventListener('click',()=>{muted=!muted;$('#snd').textContent='音效'+(muted?'關':'');});
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'gas',w:'gas',ArrowDown:'brk',s:'brk'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k&&G.mode==='play'){inp[k]=1;e.preventDefault();}else if(e.key===' '&&G.mode==='play'){e.preventDefault();if(G.ph==='fight')inp.spray=1;else honk();}else if(e.key==='Escape'||e.key==='p'){G.mode==='play'?pause():G.mode==='paused'&&act('resume');}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)inp[k]=0;if(e.key===' ')inp.spray=0;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
addEventListener('blur',()=>{inp.l=inp.r=inp.gas=inp.brk=inp.spray=0;});
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||0);last=now;tnow=now/1000;
  if(G.mode==='play')update(dt);else if(G.mode==='quake')quakeUpdate(dt);
  if(laneWant&&G.mode==='play'&&V){laneWant=0;laneShown=1;laneCard();}
  if(vw&&F){render(dt);hud();sirenUpdate();}
}
window.__t={finish:(a,b)=>finishMission(a,b),RESget:()=>({RES,SAFE,haz}),hooks:()=>({startLay,startD2,startPull,connected,startFight,startLadder,spawnVeh,fightDone}),honk,G,inp,update,get:()=>({neigh,npcs,V,PP,F,PT,cars,park,goal:goalNow(),gps,cam,trail,blk,hyd}),route,MIS,LIGHTS,lightGreen,loadMission,act,VICS:()=>VICS,render:()=>render(0)};
resize();menu();
requestAnimationFrame(frame);
})();
</script>

</body></html>
